<template>
    <template if:false={isCompleted}>
        <lightning-card title="Apagar uma Conta pelo nome">
            <lightning-input label="Nome da Conta" value={accountName} onchange={handleNameChange} required></lightning-input>
            <lightning-button label="Apagar" onclick={handleDelete} class="s-m-top"></lightning-button>
        </lightning-card>
    </template>
    <template if:true={isCompleted}> 
        <div class="completed-card">
            <p>Conta apagada com sucesso!</p>
            <lightning-button label="Apagar outra conta" onclick={handleDeleteAnother}></lightning-button>
        </div>
    </template> 
    <c-custom-toast></c-custom-toast>
</template>
